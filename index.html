<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RNG Simulator</title>
<style>
* {
  margin: 0; padding: 0; box-sizing: border-box; text-decoration: none;
  -webkit-tap-highlight-color: transparent; outline: none; box-shadow: none;
}
body {
  background: linear-gradient(#424242, #111111); min-height: 100dvh; font-size: 16px;
  overflow: hidden; font-weight: bold;
}

#topbar {
  display: flex; background-color: #222222; width: 100%; height: 2.5em; color: white;
  font-family: sans-serif; align-items: center; text-align: left; justify-content: space-between;
  font-size: 20px; transition: font-size 0.4s ease; font-style: italic; padding: 0 1rem;
}
#topbar:hover {
  font-size: 24px; cursor: default;
}

#rolled {
  color: white; font-size: 30px; font-family: sans-serif; margin: 0 1rem;
  padding-top: 1rem; transition: opacity 0.5s ease, visibility 0.3s ease;
  opacity: 0; visibility: hidden;
}

.precision-container {
  display: flex; justify-content: flex-end; align-items: center; gap: 8px;
}
.precision-label {
  color: white; font-family: sans-serif;  font-size: 20px; text-decoration: underline;
}
#precision-select {
  font-family: sans-serif; font-weight: bold; font-size: 20px; cursor: pointer; outline: none;
  border: 2px solid white; color: white; background-color: transparent; border-radius: 5px;
}
#precision-select option {
  background-color: #323232; color: white; font-weight: bold;
}

#rollBtn {
  display: flex;  width: 10rem; height: 3rem; align-items: center; text-align: center;
  justify-content: center; font-family: sans-serif; color: #99ff99; font-size: 1.8em;
  border-radius: 0.5em; border: 0.175em solid transparent; margin-left: 1rem;
  background: linear-gradient(#00ff44, #00c434) padding-box, linear-gradient(#00c434, #019128) border-box;
  -webkit-user-select: none; user-select: none; font-weight: bold; transform: translateY(0rem) scale(1);
  transition: transform 0.4s ease; margin-top: -1rem;
}
#rollBtn:hover {
  transform: translateY(0rem) scale(1.2); cursor: pointer;
}
#rollBtn.shifted {
  transform: translateY(2rem) scale(1); transition: transform 0.5s ease;
}
#rollBtn.shifted:hover {
  transform: translateY(2rem) scale(1.2); cursor: pointer;
}
#rollBtn:active, #rollBtn.active {
  transform: translateY(0rem) scale(0.8); cursor: pointer; transition: transform 0.05s ease;
}
#rollBtn.shifted:active, #rollBtn.shifted.active {
  transform: translateY(2rem) scale(0.8); transition: transform 0.05s ease;
}
</style>
</head>
<body>
  <div id="topbar">
    <span id="title">RNG Simulator - v0.0.1 Alpha</span>
    <span id="money" style="color: #17fc03;">$0</span>
  </div>

  <div id="rolled">You rolled: </div>

  <button id="rollBtn">Roll</button>

  <div class="precision-container">
    <label class="precision-label" for="precision-select">Decimal Places: </label>
    <select id="precision-select">
      <option value="2" selected>2</option>
      <option value="4">4</option>
      <option value="8">8</option>
      <option value="16">16</option>
    </select>
  </div>

  
<script>
"use strict"

const rollBtn = document.getElementById("rollBtn");
const moneyCounter = document.getElementById("money");
const rolled = document.getElementById("rolled");
let money = 0;
let yourRoll = 0;
let rollCount = 0;

function roll() {
  yourRoll = Math.random();
  money += yourRoll;
  rollCount++;
  if(rollCount > 0) {
    rolled.style.opacity = "1";
    rolled.style.visibility = "visible";
    rollBtn.classList.add("shifted");
  }
}

rollBtn.addEventListener("click", roll);
document.addEventListener("keydown", (e) => {
  if(e.code === "Space") {
    e.preventDefault();
    if(e.repeat) return;
    rollBtn.classList.add("active");
    roll();
  }
});
document.addEventListener("keyup", (e) => {
  if (e.code === "Space") {
    rollBtn.classList.remove("active");
  }
});

function animateUI() {
  requestAnimationFrame(animateUI);
  moneyCounter.textContent = "$" + money.toFixed(2);
  rolled.textContent = 'You rolled a "' + yourRoll.toFixed(2) + '."';
}
animateUI();
</script>
</body>
</html>
